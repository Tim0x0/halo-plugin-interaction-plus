plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.6.2"
}

group 'com.timxs.interactionplus'
// 版本号由 gradle.properties 的 version 提供

repositories {
    mavenCentral()
}

dependencies {
    // Halo API 与插件开发平台基线。
    implementation platform('run.halo.tools.platform:plugin:2.25.0')
    compileOnly 'run.halo.app:api'

    // 对外发奖 API 契约（接口 + DTO）：打进插件 jar，供本插件实现、外部插件 compileOnly 依赖
    implementation project(':api')

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs << '-Xlint:deprecation'
}

// Console / UC 前端资源按 plugin.yaml 的 Halo 要求打包到 resources/ui。
tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

// 前台 Runtime 产物输出到插件静态资源目录：
// /plugins/interaction-plus/assets/runtime/interaction-plus.runtime.js
tasks.register('processRuntimeResources', Copy) {
    from project(':runtime').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/assets/runtime')
    dependsOn project(':runtime').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processRuntimeResources')
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.25.0'
}
