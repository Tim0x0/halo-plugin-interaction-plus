# JitPack 构建环境配置：构建 api 模块的 compileOnly 依赖构件。
# 文档：https://docs.jitpack.io/building/
# 本项目为 Java 21，须显式指定，否则 JitPack 默认 JDK 无法编译。
jdk:
  - openjdk21
# 在构建机执行 publishToMavenLocal，供 JitPack 收集 Maven 构件。
# -Pversion 使用 JitPack 注入的 VERSION，并去掉可选的 v 前缀。
install:
  - ./gradlew :api:build :api:publishToMavenLocal -Pversion=${VERSION#v} --no-daemon
