plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.timxs.interactionplus'
// 版本号由根项目 gradle.properties 提供。

repositories {
    mavenCentral()
}

dependencies {
    // 仅用 Halo 提供的 pf4j ExtensionPoint 与 reactor：运行时由宿主提供，编译期可见即可，不打包。
    // 外部插件依赖本 api 模块时同理（compileOnly），运行时由 Halo 提供这些传递依赖。
    compileOnly platform('run.halo.tools.platform:plugin:2.25.0')
    compileOnly 'run.halo.app:api'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // 附带源码 jar，便于外部插件查阅接口 / DTO 定义
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

// api 模块的 Maven publication，供其他 Halo 插件以 compileOnly 方式引用接口与 DTO。
// JitPack 多模块坐标约定（见 https://docs.jitpack.io/ ）：
//   group    = com.github.<GitHub 用户>.<仓库名>
//   artifact = 模块 artifactId（此处为 api）
//   version  = project.version
// 1.0.0 坐标：com.github.Tim0x0.halo-plugin-interaction-plus:api:1.0.0
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            // project.group 只用于源码构建命名空间；这里显式声明对外依赖坐标。
            groupId = 'com.github.Tim0x0.halo-plugin-interaction-plus'
            artifactId = 'api'
            version = project.version
            // Maven publication 元数据。
            pom {
                name = 'interaction-plus api'
                description = 'Interaction Plus 对外插件 API：发奖、身份查询与统计贡献扩展点的接口与 DTO'
                url = 'https://github.com/Tim0x0/halo-plugin-interaction-plus'
                licenses {
                    license {
                        name = 'GPL-3.0'
                        url = 'https://github.com/Tim0x0/halo-plugin-interaction-plus/blob/main/LICENSE'
                    }
                }
                developers {
                    developer {
                        id = 'Tim0x0'
                        name = 'Tim0x0'
                    }
                }
                scm {
                    url = 'https://github.com/Tim0x0/halo-plugin-interaction-plus'
                    connection = 'scm:git:https://github.com/Tim0x0/halo-plugin-interaction-plus.git'
                }
            }
        }
    }
}
