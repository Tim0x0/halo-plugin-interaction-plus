# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # The name defines how the plugin is invoked, A unique name
  name: interaction-plus
spec:
  enabled: true
  # UI 资源目录与构建配置要求 Halo 2.25 或更高版本。
  requires: ">=2.25.0"
  author:
    name: Tim0x0
    website: https://github.com/Tim0x0
  logo: logo.png
  homepage: https://github.com/Tim0x0/halo-plugin-interaction-plus#readme
  repo: https://github.com/Tim0x0/halo-plugin-interaction-plus
  issues: https://blog.timxs.com/bbs?category=interaction-plus
  displayName: "互动增强"
  description: "为站点增强社区互动：身份与装扮、前台展示，并开放给其他插件接入。"
  settingName: "interaction-plus-settings"
  configMapName: "interaction-plus-configmap"
  license:
    - name: "GPL-3.0"
      url: "https://github.com/Tim0x0/halo-plugin-interaction-plus/blob/main/LICENSE"
